<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>실험 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --ink:#1d2433; --muted:#5b6475; --line:#e3e6ee; --soft:#f4f6fb; --accent:#4f5bd5; --ok:#1a7f37; --warn:#b42318; --amber:#9a6700; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Pretendard","Noto Sans KR",sans-serif; color:var(--ink); background:#fafbfe; font-size:14px; }
  header { background:#fff; border-bottom:1px solid var(--line); padding:14px 24px; display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:5; }
  header h1 { font-size:17px; margin:0; }
  header .sp { flex:1; }
  nav.tabs { display:flex; gap:4px; }
  nav.tabs button { font:inherit; border:0; background:none; padding:8px 12px; border-radius:8px; color:var(--muted); cursor:pointer; }
  nav.tabs button.on { background:var(--soft); color:var(--ink); font-weight:700; }
  main { max-width:1280px; margin:0 auto; padding:24px; }
  section { display:none; } section.on { display:block; }
  h2 { font-size:18px; margin:0 0 12px; } h3 { font-size:15px; margin:24px 0 8px; }
  p.note { color:var(--muted); margin:4px 0 12px; line-height:1.6; }
  .cards { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:20px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card .k { color:var(--muted); font-size:12px; } .card .v { font-size:24px; font-weight:800; margin-top:4px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:center; white-space:nowrap; }
  th { background:var(--soft); font-weight:700; font-size:13px; }
  td.l, th.l { text-align:left; }
  tr.ex td { color:#9aa1b0; text-decoration:line-through; } tr.ex td.act { text-decoration:none; }
  .tag { display:inline-block; padding:2px 8px; border-radius:6px; font-size:12px; }
  .t-done { background:#dafbe1; color:var(--ok); } .t-run { background:#ddf4ff; color:#0550ae; } .t-stop { background:#ffebe9; color:var(--warn); } .t-old { background:#fff8c5; color:var(--amber); }
  .flag { color:var(--warn); font-weight:700; }
  button.b, a.b { font:inherit; padding:7px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; text-decoration:none; display:inline-block; }
  button.p { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--warn); border-color:#f2b8b5; }
  input[type=text], input[type=password] { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:8px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .cellgrid td.full { background:#dafbe1; } .cellgrid td.next { outline:2px solid var(--accent); outline-offset:-2px; }
  .login { max-width:420px; margin:80px auto; background:#fff; border:1px solid var(--line); border-radius:14px; padding:28px; }
  .login h1 { font-size:20px; margin:0 0 8px; }
  .login input { width:100%; margin:8px 0; }
  .msg { color:var(--warn); min-height:20px; }
  .scroll { overflow-x:auto; }
  .links td { text-align:left; } .links code { font-size:12px; }
  .detail { margin-top:28px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px; }
  .ev { display:inline-block; background:var(--soft); border-radius:6px; padding:2px 7px; margin:2px 0; font-size:12px; }
  .ev.back { background:#ddf4ff; } .ev.miss { background:#fff8c5; }
  .fb { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:8px; line-height:1.6; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="login" class="login">
  <h1>실험 관리자</h1>
  <p class="note">Apps Script에 정한 관리자 비밀번호를 입력하세요.</p>
  <input type="password" id="key" placeholder="관리자 비밀번호">
  <button class="b p" id="enter">들어가기</button>
  <p class="msg" id="lmsg"></p>
</div>

<div id="appwrap" style="display:none">
<header>
  <h1>실험 관리자</h1>
  <nav class="tabs" id="tabs">
    <button data-t="status" class="on">현황</button><button data-t="people">참가자</button>
    <button data-t="summary">결과 요약</button><button data-t="pilot">파일럿 점검</button>
    <button data-t="download">내려받기</button><button data-t="links">링크와 미리보기</button>
  </nav>
  <span class="sp"></span>
  <span id="updated" class="note"></span>
  <button class="b" id="reload">새로고침</button>
</header>
<main>
  <section id="s-status" class="on"></section>
  <section id="s-people"></section>
  <section id="s-summary"></section>
  <section id="s-pilot"></section>
  <section id="s-download"></section>
  <section id="s-links"></section>
</main>
</div>

<script src="config.js?v=10311213"></script>
<script src="content.js?v=10311213"></script>
<script src="admin.js?v=10311213"></script>
</body>
</html>
